name: Devcontainer

on:
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "versions.properties"
      # versions.properties の改行を決めているので、変わったときもイメージをビルドして確かめる。
      - ".gitattributes"
      - ".dockerignore"
      - ".github/workflows/devcontainer.yml"

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build devcontainer image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 認証トークンを .git/config に残さない。
          persist-credentials: false

      # devcontainer.json の build.context と同じく、リポジトリのルートを context にする。
      - name: Build image
        run: docker build -f .devcontainer/Dockerfile .
