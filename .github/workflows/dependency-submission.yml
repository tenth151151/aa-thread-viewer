name: Dependency submission

# Dependabot が推移的な依存関係の脆弱性を検出できるように、Gradle の依存関係のグラフを GitHub に送る。
# PR では動かない。workflow_dispatch は、既定のブランチにこのファイルがあるときだけ使える。
# リポジトリの Dependency graph が無効だと、グラフの送信は失敗する。Dependabot alerts を有効にすると、Dependency graph も生成される。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-submission-${{ github.ref }}
  # 実行中の run は取り消さない。待っている run は新しい run に置き換えられるが、最新のコミットのグラフが送られるので問題ない。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # グラフの書き込みに contents: write が必要なので、このジョブにだけ付ける。
    permissions:
      contents: write
    steps:
      # 以下の Check out から Install Android SDK までの準備のステップは、ci.yml と同じ内容にしている。変えるときは両方をそろえる。
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 認証トークンを .git/config に残さない。
          persist-credentials: false

      # versions.properties が、JDK と Android SDK のバージョンの唯一の正である。
      # KEY=VALUE の行だけを環境変数にし、後のステップから env コンテキストで参照する。
      - name: Load versions
        run: grep -E '^[A-Z0-9_]+=' versions.properties >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      # devcontainer と同じバージョンの command-line tools を、チェックサムを確かめてから使う。
      # * ランナーに入っている cmdline-tools/latest は、イメージの更新で変わるので使わない。
      # * SDK のルートは $RUNNER_TEMP 配下に新しく作る。ランナーの既存の SDK (/usr/local/lib/android/sdk) と
      #   混ざらず、そこに入っているバージョンの影響も受けない。
      # * ANDROID_HOME と ANDROID_SDK_ROOT の両方をこのルートに上書きし、以降のステップ (Gradle) が同じ SDK を使うようにする。
      #   ランナーは両方をもとの SDK に向けており、片方だけ上書きして食い違うと AGP がビルドを失敗させる。
      #   sdkmanager にも同じルートを --sdk_root で明示し、別の場所に入れてしまうことを防ぐ。
      - name: Install Android SDK
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          zip_file="commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip_file" "https://dl.google.com/android/repository/$zip_file"
          echo "${ANDROID_CMDLINE_TOOLS_SHA256}  $RUNNER_TEMP/$zip_file" | sha256sum -c -
          mkdir -p "$sdk_root/cmdline-tools" "$RUNNER_TEMP/cmdline-tools-unzip"
          unzip -q "$RUNNER_TEMP/$zip_file" -d "$RUNNER_TEMP/cmdline-tools-unzip"
          mv "$RUNNER_TEMP/cmdline-tools-unzip/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          # このステップは shell を省いているので、既定の bash -e では pipefail が付かない。
          # shell: bash を指定すると pipefail が有効になり、yes | で渡すと yes が SIGPIPE で終了してステップが失敗する。
          # プロセス置換なら、シェルの指定に関係なく失敗しない。
          "$sdkmanager" --sdk_root="$sdk_root" --licenses < <(yes) > /dev/null
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      # 依存関係の解決で AGP の構成まで走るため、上で JDK と Android SDK を用意している。
      # validate-wrappers だけ指定する。既定が false なので、ci.yml の setup-gradle と同じく wrapper の jar を検証させる。
      # Gradle の準備 (setup-gradle) は、この action が内部で行う。
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
