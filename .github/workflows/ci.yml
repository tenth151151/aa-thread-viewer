name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # main への push は取り消さず、マージしたコミットごとに結果を残す。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Check and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 認証トークンを .git/config に残さない。
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25.0.3

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # このステップは shell を省いているので、既定の bash -e では pipefail が付かない。
          # shell: bash を指定すると pipefail が有効になり、yes | で渡すと yes が SIGPIPE で終了してステップが失敗する。
          # プロセス置換なら、シェルの指定に関係なく失敗しない。
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      # wrapper の jar の検証 (validate-wrappers) は、既定で有効である。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run check and assembleDebug
        run: ./gradlew check assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          retention-days: 7
