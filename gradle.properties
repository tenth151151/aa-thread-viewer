org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Gradle の非推奨の機能の警告は、エラーにしない (--warning-mode=fail や org.gradle.warning.mode=fail を入れない)。
# Gradle 9.8.1 と AGP 9.4.1 で出ている警告は Configuration.setVisible(boolean) (Gradle 11 で削除予定) の 1 種類だけで、出どころは AGP 9.4.1 である。
# スタックトレースはすべて AGP の中にあり、このリポジトリでは直せない。入れると CI と dependency submission が常に失敗する。
# AGP を上げたときは、./gradlew check assembleDebug --warning-mode=all で確かめ直し、警告がなくなっていたら入れることを検討する。
