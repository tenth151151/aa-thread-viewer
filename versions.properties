# JDK、Android SDK、エミュレータのシステムイメージのバージョンを定める、唯一の正である。
# * .devcontainer/Dockerfile、.github/workflows/ci.yml、.github/workflows/dependency-submission.yml、app/build.gradle.kts が、このファイルを読む。bin/windows/setup-emulator.ps1 は、EMULATOR_API だけを読む。
# * KEY=VALUE の形式で書く。= の前後に空白を入れず、値に空白や引用符を使わない。
# * 値に \ を使わない。Gradle が java.util.Properties で読むので、\ をエスケープとして解釈して値が変わるためである。
# * 行の途中からコメントを書かない。KEY=value # メモ の # メモ が値に含まれてしまうためである。コメントは # で始まる行にだけ書く。

# JDK (Temurin)
# * JDK_VERSION は setup-java に渡す値で、Adoptium の semver の形 (例: 25.0.3+9.0.LTS) で書く。
#   setup-java は、+ 付きの版を一覧の semver と完全に一致するときだけ選ぶ。25.0.3+9 のように略すと見つからないので、一覧の表記のとおりに書く。
#   値は、次の URL の version_data.semver か、setup-java のエラーに出る版の一覧から探す。<major> は 25 などの主版番号である。
#   https://api.adoptium.net/v3/assets/feature_releases/<major>/ga?architecture=x64&image_type=jdk&os=linux&vendor=eclipse
# * JDK_SDKMAN_ID は SDKMAN の識別子である。`sdk list java` で確認する。
# * 書式が違うだけで同じ JDK を指すので、上げるときは必ず両方を直す。
JDK_VERSION=25.0.3+9.0.LTS
JDK_SDKMAN_ID=25.0.3.0+9-tem

# Android SDK
# * platform は、Compose 1.13 のライブラリが compileSdk 37.1 以上を求めるため、sdkmanager 22.0 の一覧で beta などの印のない最新の 37.2 にしている。build-tools は、AGP 9.5.0 のリリースノートの互換性の表にある既定の 36.0.0 に合わせている。
# * ANDROID_PLATFORM は android-<major>.<minor> の形で書く。app/build.gradle.kts がこの形から compileSdk の major と minor を組み立てるためである。エミュレータのシステムイメージの版は、EMULATOR_API で別に決める。
# * command-line tools は、公式ページのチェックサムで検証する。バージョンを変えるときは、VERSION と SHA256 を揃えて更新する。
#   https://developer.android.com/studio#command-line-tools-only
ANDROID_PLATFORM=android-37.2
ANDROID_BUILD_TOOLS=36.0.0
ANDROID_CMDLINE_TOOLS_VERSION=15859902
ANDROID_CMDLINE_TOOLS_SHA256=4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583

# エミュレータ
# * EMULATOR_API は、bin/windows/setup-emulator.ps1 の既定のシステムイメージの API の版である。ANDROID_PLATFORM とは別に決める。
#   sdkmanager 22.0 の一覧で、android-37.2 と android-37.1 には google_apis;x86_64 のイメージがない (google_apis_ps16k と google_apis_playstore_ps16k だけ) ためである。
#   google_apis;x86_64 があるのは android-37.0 である。
# * android- を付けずに、system-images;android-<版>;google_apis;x86_64 の <版> の部分を書く (例: 37.0)。数字を . でつないだ形で、AVD の名前 aatv-api-<版> にも使われる。
EMULATOR_API=37.0
